<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1630" viewBox="0 0 1200 1630" font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="1200" height="1630" fill="#f7f7fb"/>

  <!-- ===== Title ===== -->
  <text x="600" y="64" text-anchor="middle" font-size="38" font-weight="700" fill="#18181b">Pre-Meeting Investor Brief — Components Map</text>
  <text x="600" y="104" text-anchor="middle" font-size="21" fill="#52525b">A founder types an investor's name. The app searches the live web, then Gemini Flash writes a sourced briefing.</text>

  <!-- ===== STEP 1 ===== -->
  <rect x="140" y="150" width="920" height="150" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <circle cx="205" cy="225" r="27" fill="#4f46e5"/>
  <text x="205" y="235" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">1</text>
  <text x="258" y="202" font-size="27" font-weight="700" fill="#18181b">Founder</text>
  <text x="258" y="240" font-size="21" fill="#52525b">Types the investor's name and their firm.</text>
  <text x="258" y="272" font-size="21" fill="#52525b">Sets their sector and stage once — the app remembers it.</text>
  <rect x="885" y="207" width="140" height="36" rx="18" fill="#eef2ff"/>
  <text x="955" y="231" text-anchor="middle" font-size="18" font-weight="600" fill="#4338ca">Browser</text>

  <line x1="600" y1="310" x2="600" y2="360" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="342" font-size="19" fill="#4338ca">investor name + firm, plus your sector and stage</text>

  <!-- ===== STEP 2 ===== -->
  <rect x="140" y="370" width="920" height="130" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <circle cx="205" cy="435" r="27" fill="#4f46e5"/>
  <text x="205" y="445" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">2</text>
  <text x="258" y="422" font-size="27" font-weight="700" fill="#18181b">Web page</text>
  <text x="258" y="460" font-size="21" fill="#52525b">Shows the form, then passes the details to the app's own server.</text>
  <rect x="885" y="417" width="140" height="36" rx="18" fill="#eef2ff"/>
  <text x="955" y="441" text-anchor="middle" font-size="18" font-weight="600" fill="#4338ca">Next.js</text>

  <line x1="600" y1="510" x2="600" y2="560" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="542" font-size="19" fill="#4338ca">one request, sent as JSON</text>

  <!-- ===== STEP 3 ===== -->
  <rect x="140" y="570" width="920" height="130" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <circle cx="205" cy="635" r="27" fill="#4f46e5"/>
  <text x="205" y="645" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">3</text>
  <text x="258" y="622" font-size="27" font-weight="700" fill="#18181b">Server</text>
  <text x="258" y="660" font-size="21" fill="#52525b">Checks the input is valid, then goes looking for information.</text>
  <rect x="845" y="617" width="180" height="36" rx="18" fill="#eef2ff"/>
  <text x="935" y="641" text-anchor="middle" font-size="18" font-weight="600" fill="#4338ca">/api/brief</text>

  <line x1="600" y1="710" x2="600" y2="760" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="742" font-size="19" fill="#4338ca">5 search queries, built from the investor and firm</text>

  <!-- ===== STEP 4 ===== -->
  <rect x="140" y="770" width="920" height="150" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2.5"/>
  <circle cx="205" cy="845" r="27" fill="#4f46e5"/>
  <text x="205" y="855" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">4</text>
  <text x="258" y="822" font-size="27" font-weight="700" fill="#18181b">Live web search</text>
  <text x="258" y="860" font-size="21" fill="#52525b">Searches the real internet right now — news, blogs, interviews.</text>
  <text x="258" y="892" font-size="21" fill="#52525b">Two of the five searches only look at the <tspan font-weight="700" fill="#18181b">last 90 days</tspan>.</text>
  <rect x="885" y="827" width="140" height="36" rx="18" fill="#eef2ff"/>
  <text x="955" y="851" text-anchor="middle" font-size="18" font-weight="600" fill="#4338ca">Tavily API</text>

  <line x1="600" y1="930" x2="600" y2="980" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="962" font-size="19" fill="#4338ca">results, numbered 1, 2, 3 … with links and dates</text>

  <!-- ===== STEP 5 ===== -->
  <rect x="140" y="990" width="920" height="180" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2.5"/>
  <circle cx="205" cy="1080" r="27" fill="#4f46e5"/>
  <text x="205" y="1090" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">5</text>
  <text x="258" y="1042" font-size="27" font-weight="700" fill="#18181b">AI writes the brief</text>
  <text x="258" y="1080" font-size="21" fill="#52525b">Reads <tspan font-weight="700" fill="#18181b">only</tspan> those search results — never its own memory.</text>
  <text x="258" y="1112" font-size="21" fill="#52525b">Must fill a fixed form, so no section can be missing.</text>
  <text x="258" y="1144" font-size="21" fill="#52525b">Writes the talking points for <tspan font-weight="700" fill="#18181b">your sector and stage</tspan>.</text>
  <rect x="845" y="1062" width="180" height="36" rx="18" fill="#eef2ff"/>
  <text x="935" y="1086" text-anchor="middle" font-size="18" font-weight="600" fill="#4338ca">Gemini Flash</text>

  <line x1="600" y1="1180" x2="600" y2="1230" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="1212" font-size="19" fill="#4338ca">the finished brief, in a fixed format</text>

  <!-- ===== STEP 6 ===== -->
  <rect x="140" y="1240" width="920" height="180" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <circle cx="205" cy="1330" r="27" fill="#16a34a"/>
  <text x="205" y="1340" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">6</text>
  <text x="258" y="1292" font-size="27" font-weight="700" fill="#18181b">The founder reads it</text>
  <text x="258" y="1330" font-size="21" fill="#52525b">1. Recent deals (last 90 days) &#160;&#160;&#160;2. What they invest in</text>
  <text x="258" y="1362" font-size="21" fill="#52525b">3. Red flags &#160;&#160;&#160;4. Three talking points &#160;&#160;+ sources</text>
  <text x="258" y="1394" font-size="21" fill="#52525b">The talking points are written for <tspan font-weight="700" fill="#18181b">their</tspan> sector and stage.</text>
  <rect x="885" y="1312" width="140" height="36" rx="18" fill="#dcfce7"/>
  <text x="955" y="1336" text-anchor="middle" font-size="18" font-weight="600" fill="#15803d">On screen</text>

  <!-- ===== Footer note ===== -->
  <rect x="140" y="1460" width="920" height="128" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <text x="175" y="1497" font-size="20" font-weight="700" fill="#92400e">Why it cannot make things up</text>
  <text x="175" y="1530" font-size="19" fill="#78350f">The AI only sees results fetched seconds earlier — never its own memory.</text>
  <text x="175" y="1561" font-size="19" fill="#78350f">It cites each fact by source number, and the app attaches the real link itself.</text>

</svg>
