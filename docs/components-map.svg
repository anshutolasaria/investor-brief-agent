<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1565" viewBox="0 0 1200 1565" font-family="Segoe UI, Helvetica, Arial, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
  </defs>

  <rect width="1200" height="1565" fill="#f7f7fb"/>

  <!-- ===== Title ===== -->
  <text x="600" y="64" text-anchor="middle" font-size="38" font-weight="700" fill="#18181b">Pre-Meeting Investor Brief — Components Map</text>
  <text x="600" y="104" text-anchor="middle" font-size="21" fill="#52525b">A founder types an investor's name. The app searches the live web, then Gemini Flash writes a sourced briefing.</text>

  <!-- ===== STEP 1 ===== -->
  <rect x="140" y="150" width="920" height="130" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <circle cx="205" cy="215" r="27" fill="#4f46e5"/>
  <text x="205" y="225" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">1</text>
  <text x="258" y="202" font-size="27" font-weight="700" fill="#18181b">Founder</text>
  <text x="258" y="240" font-size="21" fill="#52525b">Types the investor's name and their firm, and clicks Generate.</text>
  <rect x="885" y="193" width="140" height="36" rx="18" fill="#eef2ff"/>
  <text x="955" y="217" text-anchor="middle" font-size="18" font-weight="600" fill="#4338ca">Browser</text>

  <line x1="600" y1="285" x2="600" y2="345" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="322" font-size="19" fill="#4338ca">investor name + firm name</text>

  <!-- ===== STEP 2 ===== -->
  <rect x="140" y="355" width="920" height="130" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <circle cx="205" cy="420" r="27" fill="#4f46e5"/>
  <text x="205" y="430" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">2</text>
  <text x="258" y="407" font-size="27" font-weight="700" fill="#18181b">Web page</text>
  <text x="258" y="445" font-size="21" fill="#52525b">Shows the form, then passes the details to the app's own server.</text>
  <rect x="885" y="398" width="140" height="36" rx="18" fill="#eef2ff"/>
  <text x="955" y="422" text-anchor="middle" font-size="18" font-weight="600" fill="#4338ca">Next.js</text>

  <line x1="600" y1="490" x2="600" y2="550" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="527" font-size="19" fill="#4338ca">one request, sent as JSON</text>

  <!-- ===== STEP 3 ===== -->
  <rect x="140" y="560" width="920" height="130" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <circle cx="205" cy="625" r="27" fill="#4f46e5"/>
  <text x="205" y="635" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">3</text>
  <text x="258" y="612" font-size="27" font-weight="700" fill="#18181b">Server</text>
  <text x="258" y="650" font-size="21" fill="#52525b">Checks the input is valid, then goes looking for information.</text>
  <rect x="845" y="603" width="180" height="36" rx="18" fill="#eef2ff"/>
  <text x="935" y="627" text-anchor="middle" font-size="18" font-weight="600" fill="#4338ca">/api/brief</text>

  <line x1="600" y1="695" x2="600" y2="755" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="732" font-size="19" fill="#4338ca">5 search queries, all sent at the same time</text>

  <!-- ===== STEP 4 ===== -->
  <rect x="140" y="765" width="920" height="150" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2.5"/>
  <circle cx="205" cy="840" r="27" fill="#4f46e5"/>
  <text x="205" y="850" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">4</text>
  <text x="258" y="817" font-size="27" font-weight="700" fill="#18181b">Live web search</text>
  <text x="258" y="852" font-size="21" fill="#52525b">Searches the real internet right now — news, blogs, interviews.</text>
  <text x="258" y="884" font-size="21" fill="#52525b">Two of the five searches only look at the <tspan font-weight="700" fill="#18181b">last 90 days</tspan>.</text>
  <rect x="885" y="822" width="140" height="36" rx="18" fill="#eef2ff"/>
  <text x="955" y="846" text-anchor="middle" font-size="18" font-weight="600" fill="#4338ca">Tavily API</text>

  <line x1="600" y1="920" x2="600" y2="980" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="957" font-size="19" fill="#4338ca">results, numbered 1, 2, 3 … with links and dates</text>

  <!-- ===== STEP 5 ===== -->
  <rect x="140" y="990" width="920" height="150" rx="18" fill="#ffffff" stroke="#c7d2fe" stroke-width="2.5"/>
  <circle cx="205" cy="1065" r="27" fill="#4f46e5"/>
  <text x="205" y="1075" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">5</text>
  <text x="258" y="1042" font-size="27" font-weight="700" fill="#18181b">AI writes the brief</text>
  <text x="258" y="1077" font-size="21" fill="#52525b">Reads <tspan font-weight="700" fill="#18181b">only</tspan> those search results — never its own memory.</text>
  <text x="258" y="1109" font-size="21" fill="#52525b">Must fill a fixed form, so no section can be missing.</text>
  <rect x="845" y="1047" width="180" height="36" rx="18" fill="#eef2ff"/>
  <text x="935" y="1071" text-anchor="middle" font-size="18" font-weight="600" fill="#4338ca">Gemini Flash</text>

  <line x1="600" y1="1145" x2="600" y2="1205" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="620" y="1182" font-size="19" fill="#4338ca">the finished brief, in a fixed format</text>

  <!-- ===== STEP 6 ===== -->
  <rect x="140" y="1215" width="920" height="150" rx="18" fill="#ffffff" stroke="#e4e4e7" stroke-width="2"/>
  <circle cx="205" cy="1290" r="27" fill="#16a34a"/>
  <text x="205" y="1300" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">6</text>
  <text x="258" y="1267" font-size="27" font-weight="700" fill="#18181b">The founder reads it</text>
  <text x="258" y="1302" font-size="21" fill="#52525b">1. Recent deals (90 days) &#160;&#160;2. What they invest in</text>
  <text x="258" y="1334" font-size="21" fill="#52525b">3. Red flags &#160;&#160;4. Three talking points &#160;&#160;+ sources</text>
  <rect x="885" y="1272" width="140" height="36" rx="18" fill="#dcfce7"/>
  <text x="955" y="1296" text-anchor="middle" font-size="18" font-weight="600" fill="#15803d">On screen</text>

  <!-- ===== Footer note ===== -->
  <rect x="140" y="1400" width="920" height="128" rx="14" fill="#fffbeb" stroke="#fde68a" stroke-width="2"/>
  <text x="175" y="1437" font-size="20" font-weight="700" fill="#92400e">Why it cannot make things up</text>
  <text x="175" y="1470" font-size="19" fill="#78350f">The AI only sees results fetched seconds earlier — never its own memory.</text>
  <text x="175" y="1501" font-size="19" fill="#78350f">It cites each fact by source number, and the app attaches the real link itself.</text>

</svg>
